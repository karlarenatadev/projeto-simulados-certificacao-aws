name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Validate Pages artifact
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/404.html
          test -f public/.nojekyll
          test -f public/js/app.js
          test -f public/css/style.css
          test -f public/data/questions/clf-c02.json
          test -f public/manifest.json
          test -f public/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          for path in "" "js/app.js" "css/style.css" "manifest.json" "sw.js"; do
            url="${SITE_URL%/}/${path}"
            echo "Checking ${url}"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              "${url}" > /dev/null
          done
