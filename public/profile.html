<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meu Perfil — Cloud Academy A3" />
    <title>Meu Perfil — Cloud Academy A3</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "aws-dark": "#001863",
              "aws-orange": "#0033FF",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <meta name="theme-color" content="#001863" />
  </head>

  <body
    class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar"
  >
    <!-- ===== HEADER — App Shell padronizado ===== -->
    <header class="a3-header">
      <div class="flex items-center gap-2 md:gap-3">
        <button
          id="cloud-sidebar-toggle"
          class="btn-sidebar-toggle flex items-center justify-center group/cloud"
          title="Esconder menu lateral"
          aria-label="Alternar menu lateral"
          aria-expanded="true"
        >
          <i
            id="cloud-logo-icon"
            class="fa-solid fa-cloud text-2xl md:text-3xl group-hover/cloud:scale-110 transition-transform"
            aria-hidden="true"
          ></i>
        </button>
        <a href="index.html" class="a3-header-link" title="Voltar ao início">
          <div>
            <h1 class="text-base md:text-xl font-bold leading-tight">
              Cloud Academy A3
            </h1>
            <p class="text-[10px] md:text-xs text-gray-300">
              Sua jornada para certificações AWS
            </p>
          </div>
        </a>
      </div>
      <div class="a3-header-actions">
        <button
          id="btn-language"
          class="a3-btn a3-btn-secondary flex items-center gap-1 md:gap-2"
          aria-label="Alternar idioma"
          title="Alternar idioma"
        >
          <span class="text-[10px] md:text-xs font-bold"
            >🇧🇷 <span class="hidden sm:inline">PT-BR</span></span
          >
        </button>
        <button
          id="theme-toggle"
          class="a3-btn a3-btn-secondary"
          aria-label="Alternar modo escuro"
        >
          <i
            id="theme-icon"
            class="fa-solid fa-moon text-base md:text-xl"
            aria-hidden="true"
          ></i>
        </button>
        <!-- User Menu — populado pelo shell.js -->
        <div id="user-menu-container"></div>
      </div>
    </header>

    <!-- ===== SIDEBAR ESQUERDA — gerada dinamicamente pelo shell.js ===== -->
    <nav id="left-sidebar" aria-label="Menu principal" role="navigation">
      <div class="left-sidebar-nav">
        <!-- Populado por buildSidebar() no shell.js -->
      </div>
    </nav>
    <!-- ===== FIM DA SIDEBAR ESQUERDA ===== -->

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="main-content-container profile-main" id="profile-page">
      <!-- Cabeçalho do perfil -->
      <div class="a3-card profile-header-card" id="profile-header">
        <div class="profile-avatar-wrap">
          <div class="a3-avatar profile-avatar-xl" id="profile-avatar-initials">
            ?
          </div>
        </div>
        <div class="profile-info">
          <h2 class="profile-name" id="profile-display-name">Carregando…</h2>
          <p class="profile-email" id="profile-email"></p>
          <span class="a3-badge a3-role-student" id="profile-role-badge"
            >Estudante</span
          >
        </div>
      </div>

      <!-- Grade de estatísticas -->
      <section class="profile-section" aria-labelledby="profile-stats-title">
        <h3 class="profile-section-title" id="profile-stats-title">
          <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>
          Estatísticas
        </h3>
        <div class="profile-stats-grid">
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-circle-play profile-stat-icon profile-stat-icon-quiz"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-total-quizzes">0</p>
            <p class="profile-stat-label">Simulados</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-trophy profile-stat-icon profile-stat-icon-best"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-best-score">—</p>
            <p class="profile-stat-label">Melhor nota</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-fire profile-stat-icon profile-stat-icon-streak"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-streak">0</p>
            <p class="profile-stat-label">Sequência</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-star profile-stat-icon profile-stat-icon-xp"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-xp">0</p>
            <p class="profile-stat-label">XP total</p>
          </div>
        </div>
      </section>

      <!-- Certificações iniciadas -->
      <section class="profile-section" aria-labelledby="profile-certs-title">
        <h3 class="profile-section-title" id="profile-certs-title">
          <i class="fa-solid fa-certificate" aria-hidden="true"></i>
          Certificações em andamento
        </h3>
        <div class="profile-certs-list" id="profile-certs-list">
          <!-- Populado por JS -->
        </div>
      </section>

      <!-- Conquistas / badges -->
      <section class="profile-section" aria-labelledby="profile-badges-title">
        <h3 class="profile-section-title" id="profile-badges-title">
          <i class="fa-solid fa-award" aria-hidden="true"></i>
          Conquistas
        </h3>
        <div class="profile-badges-grid" id="profile-badges-grid">
          <!-- Populado por JS -->
        </div>
      </section>
    </main>

    <!-- App Shell: tema, idioma, UserMenu e Sidebar -->
    <script type="module">
      import { initShell } from "./js/shell.js";
      document.addEventListener("DOMContentLoaded", () => initShell(null));
    </script>

    <!-- Listeners de tema/idioma -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeBtn = document.getElementById("theme-toggle");
        const langBtn = document.getElementById("btn-language");
        if (themeBtn) {
          themeBtn.addEventListener("click", () => {
            if (window.toggleDarkModeShell) window.toggleDarkModeShell();
          });
        }
        if (langBtn) {
          langBtn.addEventListener("click", () => {
            const lang = localStorage.getItem("aws_sim_lang") || "pt";
            const next = lang === "pt" ? "en" : "pt";
            localStorage.setItem("aws_sim_lang", next);
            if (window.syncLanguageButtonShell)
              window.syncLanguageButtonShell();
            window.location.reload();
          });
        }
      });
    </script>

    <!-- Dados do perfil via localStorage -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // ── Ler dados do localStorage ──────────────────────────────────────
        var STORAGE_KEY_USER = "aws_sim_user";
        var STORAGE_KEY_HISTORY = "aws_quiz_history";
        var STORAGE_KEY_GAMIFICATION = "aws_gamification";
        var STORAGE_KEY_BADGES = "aws_earned_badges";

        function safeGet(key) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }

        var user = safeGet(STORAGE_KEY_USER);
        var history = safeGet(STORAGE_KEY_HISTORY) || [];
        var gamification = safeGet(STORAGE_KEY_GAMIFICATION) || {};
        var earnedBadges = safeGet(STORAGE_KEY_BADGES) || [];

        // ── Cabeçalho de perfil ────────────────────────────────────────────
        var displayName =
          (user && (user.nickname || user.full_name || user.email)) ||
          "Usuário";
        var email = (user && user.email) || "";
        var role = ((user && user.role) || "STUDENT").toUpperCase();

        var nameEl = document.getElementById("profile-display-name");
        var emailEl = document.getElementById("profile-email");
        var avatarEl = document.getElementById("profile-avatar-initials");
        var roleEl = document.getElementById("profile-role-badge");

        if (nameEl) nameEl.textContent = displayName;
        if (emailEl) emailEl.textContent = email;
        if (avatarEl)
          avatarEl.textContent = displayName.charAt(0).toUpperCase();

        var roleLabels = {
          STUDENT: "Estudante",
          VALIDATOR: "Validador",
          ADMIN: "Admin",
        };
        var roleClasses = {
          STUDENT: "a3-role-student",
          VALIDATOR: "a3-role-validator",
          ADMIN: "a3-role-admin",
        };
        if (roleEl) {
          roleEl.textContent = roleLabels[role] || role;
          roleEl.className =
            "a3-badge " + (roleClasses[role] || "a3-role-student");
        }

        // ── Estatísticas ───────────────────────────────────────────────────
        var totalQuizzes = Array.isArray(history) ? history.length : 0;
        var bestScore = 0;
        if (totalQuizzes > 0) {
          bestScore = Math.max.apply(
            null,
            history.map(function (h) {
              return h.percentage || 0;
            }),
          );
        }
        var streak = gamification.currentStreak || 0;
        var xp = gamification.xp || 0;

        var totalEl = document.getElementById("stat-total-quizzes");
        var bestEl = document.getElementById("stat-best-score");
        var streakEl = document.getElementById("stat-streak");
        var xpEl = document.getElementById("stat-xp");

        if (totalEl) totalEl.textContent = String(totalQuizzes);
        if (bestEl)
          bestEl.textContent =
            totalQuizzes > 0 ? Math.round(bestScore) + "%" : "—";
        if (streakEl) streakEl.textContent = String(streak);
        if (xpEl) xpEl.textContent = String(xp);

        // ── Certificações iniciadas ────────────────────────────────────────
        var certNames = {
          "clf-c02": "Cloud Practitioner",
          "saa-c03": "Solutions Architect",
          "dva-c02": "Developer Associate",
          "aif-c01": "AI Practitioner",
        };
        var certIcons = {
          "clf-c02": "fa-cloud",
          "saa-c03": "fa-building-columns",
          "dva-c02": "fa-code",
          "aif-c01": "fa-robot",
        };

        var certsSeen = {};
        if (Array.isArray(history)) {
          history.forEach(function (h) {
            if (h.certId) {
              if (!certsSeen[h.certId])
                certsSeen[h.certId] = { count: 0, best: 0 };
              certsSeen[h.certId].count++;
              if ((h.percentage || 0) > certsSeen[h.certId].best) {
                certsSeen[h.certId].best = h.percentage || 0;
              }
            }
          });
        }

        var certsEl = document.getElementById("profile-certs-list");
        if (certsEl) {
          var certKeys = Object.keys(certsSeen);
          if (certKeys.length === 0) {
            certsEl.innerHTML =
              '<p class="profile-empty-hint">Nenhuma certificação iniciada. Realize seu primeiro simulado!</p>';
          } else {
            certsEl.innerHTML = certKeys
              .map(function (certId) {
                var data = certsSeen[certId];
                var awsBest = Math.floor((data.best / 100) * 900) + 100;
                return (
                  '<div class="a3-card profile-cert-card">' +
                  '<i class="fa-solid ' +
                  (certIcons[certId] || "fa-award") +
                  ' profile-cert-icon" aria-hidden="true"></i>' +
                  '<div class="profile-cert-info">' +
                  '<p class="profile-cert-name">' +
                  (certNames[certId] || certId) +
                  "</p>" +
                  '<p class="profile-cert-meta">' +
                  data.count +
                  " simulado(s) · Melhor: " +
                  awsBest +
                  "</p>" +
                  "</div>" +
                  "</div>"
                );
              })
              .join("");
          }
        }

        // ── Conquistas/badges ──────────────────────────────────────────────
        var badgesEl = document.getElementById("profile-badges-grid");
        if (badgesEl) {
          if (!earnedBadges || earnedBadges.length === 0) {
            badgesEl.innerHTML =
              '<p class="profile-empty-hint">Nenhuma conquista ainda. Continue estudando!</p>';
          } else {
            badgesEl.innerHTML = earnedBadges
              .map(function (badge) {
                return (
                  '<div class="a3-card profile-badge-card" title="' +
                  (badge.name || badge.id || "Conquista") +
                  '">' +
                  '<i class="fa-solid fa-award profile-badge-icon" aria-hidden="true"></i>' +
                  '<p class="profile-badge-name">' +
                  (badge.name || badge.id || "Conquista") +
                  "</p>" +
                  "</div>"
                );
              })
              .join("");
          }
        }
      });
    </script>
  </body>
</html>
