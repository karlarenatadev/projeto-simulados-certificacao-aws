<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Simulator Hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .hub-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .hub-header { text-align: center; margin-bottom: 40px; }
        .hub-header h1 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 10px; }
        .hub-header p { color: var(--text-secondary); font-size: 1.1rem; }
        
        .levels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .level-card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .level-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .level-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--bg-color);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        .level-card h3 { font-size: 1.4rem; margin: 10px 0; }
        .level-card p { color: var(--text-secondary); flex-grow: 1; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
        .start-btn {
            background: var(--primary-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="hub-header">
            <h1>Simulador Interativo de Arquitetura</h1>
            <p>Aprenda na prática projetando soluções reais para desafios da nuvem AWS.</p>
        </div>
        
        <div class="levels-grid" id="levelsGrid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <script>
        const LEVELS = [
            { id: 'level_1_clf', title: 'Nível 1 - Cloud Practitioner', desc: 'Entenda os conceitos fundamentais e tome decisões entre serviços core.', badge: 'Iniciante' },
            { id: 'level_2_saa', title: 'Nível 2 - Solutions Architect', desc: 'Projete arquiteturas resilientes, seguras e com alta disponibilidade.', badge: 'Intermediário' },
            { id: 'level_3_dva', title: 'Nível 3 - Developer', desc: 'Foque em Serverless, APIs e CI/CD.', badge: 'Intermediário' },
            { id: 'level_4_sys', title: 'Nível 4 - SysOps', desc: 'Solucione problemas operacionais, custos e escalabilidade.', badge: 'Intermediário' },
            { id: 'level_5_sec', title: 'Nível 5 - Security', desc: 'Proteja workloads e reaja a incidentes de segurança.', badge: 'Avançado' },
            { id: 'level_6_data', title: 'Nível 6 - Data Engineer', desc: 'Construa pipelines de Big Data e Data Lakes.', badge: 'Avançado' },
            { id: 'level_7_ai', title: 'Nível 7 - AI Practitioner', desc: 'Implemente GenAI e Machine Learning na prática.', badge: 'Avançado' },
            { id: 'level_8_adv', title: 'Nível 8 - Advanced Architect', desc: 'Arquiteturas complexas, multirregião e altíssima escala.', badge: 'Especialista' },
            { id: 'investigative', title: 'Casos Investigativos', desc: 'Troubleshooting avançado. Descubra o que quebrou na infraestrutura.', badge: 'Especialista' },
        ];

        async function loadLevels() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';

            try {
                // Fetch cases to see which levels have available cases
                const response = await fetch('/api/cases?limit=100');
                const result = await response.json();
                const availableDifficulties = new Set(result.data.map(c => c.difficulty));

                LEVELS.forEach(level => {
                    const hasCases = availableDifficulties.has(level.id);
                    
                    const card = document.createElement('a');
                    card.className = 'level-card';
                    card.href = hasCases ? \`/simulator-room.html?level=\${level.id}\` : '#';
                    if (!hasCases) {
                        card.style.opacity = '0.5';
                        card.style.pointerEvents = 'none';
                    }

                    card.innerHTML = \`
                        <span class="level-badge">\${level.badge}</span>
                        <h3>\${level.title}</h3>
                        <p>\${level.desc}</p>
                        <div class="start-btn">\${hasCases ? 'Iniciar Simulação' : 'Em Breve'}</div>
                    \`;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadLevels);
    </script>
</body>
</html>
