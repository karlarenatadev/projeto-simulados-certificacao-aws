<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Simulator Hub — Cloud Academy A3</title>
    <!-- CSS consolidado do design system (inclui simulator.css via build) -->
    <link rel="stylesheet" href="./css/style.css?v=msqfhf0z" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
  <body>
    <div class="hub-container">
      <div class="hub-header">
        <h1>Simulador Interativo de Arquitetura</h1>
        <p>
          Aprenda na prática projetando soluções reais para desafios da nuvem
          AWS.
        </p>
      </div>

      <div class="levels-grid" id="levelsGrid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <script>
      const LEVELS = [
          { id: 'level_1_clf', title: 'Nível 1 - Cloud Practitioner', desc: 'Entenda os conceitos fundamentais e tome decisões entre serviços core.', badge: 'Iniciante' },
          { id: 'level_2_saa', title: 'Nível 2 - Solutions Architect', desc: 'Projete arquiteturas resilientes, seguras e com alta disponibilidade.', badge: 'Intermediário' },
          { id: 'level_3_dva', title: 'Nível 3 - Developer', desc: 'Foque em Serverless, APIs e CI/CD.', badge: 'Intermediário' },
          { id: 'level_4_sys', title: 'Nível 4 - SysOps', desc: 'Solucione problemas operacionais, custos e escalabilidade.', badge: 'Intermediário' },
          { id: 'level_5_sec', title: 'Nível 5 - Security', desc: 'Proteja workloads e reaja a incidentes de segurança.', badge: 'Avançado' },
          { id: 'level_6_data', title: 'Nível 6 - Data Engineer', desc: 'Construa pipelines de Big Data e Data Lakes.', badge: 'Avançado' },
          { id: 'level_7_ai', title: 'Nível 7 - AI Practitioner', desc: 'Implemente GenAI e Machine Learning na prática.', badge: 'Avançado' },
          { id: 'level_8_adv', title: 'Nível 8 - Advanced Architect', desc: 'Arquiteturas complexas, multirregião e altíssima escala.', badge: 'Especialista' },
          { id: 'investigative', title: 'Casos Investigativos', desc: 'Troubleshooting avançado. Descubra o que quebrou na infraestrutura.', badge: 'Especialista' },
      ];

      async function loadLevels() {
          const grid = document.getElementById('levelsGrid');
          grid.innerHTML = '';

          try {
              let response = await fetch('./api/cases?limit=100').catch(() => null);
              if (!response || !response.ok) {
                  // Fallback para arquivo estático
                  response = await fetch('./data/cases/architecture_cases.json').catch(() => null);
              }
              if (!response || !response.ok) {
                  // API e arquivo indisponíveis — renderiza todos como "em breve"
                  LEVELS.forEach(level => {
                      const card = document.createElement('div');
                      card.className = 'level-card';
                      card.style.opacity = '0.5';
                      card.style.cursor = 'default';
                      card.innerHTML = `
                          <span class="level-badge">${level.badge}</span>
                          <h3>${level.title}</h3>
                          <p>${level.desc}</p>
                          <div class="start-btn">Em Breve</div>
                      `;
                      grid.appendChild(card);
                  });
                  return;
              }
              const result = await response.json();
              const availableDifficulties = new Set(result.data.map(c => c.difficulty));

              LEVELS.forEach(level => {
                  const hasCases = availableDifficulties.has(level.id);

                  const card = document.createElement('a');
                  card.className = 'level-card';
                  card.href = hasCases ? `./simulator-room.html?level=${level.id}` : '#';
                  if (!hasCases) {
                      card.style.opacity = '0.5';
                      card.style.pointerEvents = 'none';
                  }

                  card.innerHTML = `
                      <span class="level-badge">${level.badge}</span>
                      <h3>${level.title}</h3>
                      <p>${level.desc}</p>
                      <div class="start-btn">${hasCases ? 'Iniciar Simulação' : 'Em Breve'}</div>
                  `;
                  grid.appendChild(card);
              });
          } catch (err) {
              console.error(err);
          }
      }

      document.addEventListener('DOMContentLoaded', loadLevels);
    </script>
  </body>
</html>
