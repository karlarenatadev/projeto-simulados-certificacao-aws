<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Questões - Cloud Academy A3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css?v=msv2w3tq" />
    <link rel="stylesheet" href="css/admin.css?v=msv2w3tq" />
  </head>
  <body class="has-left-sidebar">
<header class="a3-header">
      <div class="flex items-center gap-2 md:gap-3">
        <button
          id="cloud-sidebar-toggle"
          class="btn-sidebar-toggle flex items-center justify-center group/cloud"
          title="Esconder menu lateral"
          aria-label="Alternar menu lateral"
          aria-expanded="true"
        >
          <i
            id="cloud-logo-icon"
            class="fa-solid fa-cloud text-2xl md:text-3xl group-hover/cloud:scale-110 transition-transform"
            aria-hidden="true"
          ></i>
        </button>
        <a href="../index.html" class="a3-header-link" title="Voltar ao início">
          <div>
            <h1 class="text-base md:text-xl font-bold leading-tight">
              Cloud Academy A3
            </h1>
            <p class="text-[10px] md:text-xs text-gray-300">
              Sua jornada para certificações AWS
            </p>
          </div>
        </a>
      </div>
      <div class="a3-header-actions">
        <button
          id="btn-language"
          class="a3-btn a3-btn-secondary flex items-center gap-1 md:gap-2"
          aria-label="Alternar idioma"
          title="Alternar idioma"
        >
          <span class="text-[10px] md:text-xs font-bold"
            >🇧🇷 <span class="hidden sm:inline">PT-BR</span></span
          >
        </button>
        <button
          id="theme-toggle"
          class="a3-btn a3-btn-secondary"
          aria-label="Alternar modo escuro"
        >
          <i
            id="theme-icon"
            class="fa-solid fa-moon text-base md:text-xl"
            aria-hidden="true"
          ></i>
        </button>
        <button
          id="install-app"
          class="a3-btn a3-btn-secondary hidden md:flex items-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Baixar App
        </button>
        <!-- User Menu — populado pelo shell.js -->
        <div id="user-menu-container"></div>
      </div>
    </header>
<nav id="left-sidebar" aria-label="Menu principal" role="navigation">
  <!--
    .left-sidebar-nav é esvaziado e repovoado por buildSidebar(user)
    no momento do boot. O botão abaixo é apenas um fallback visual
    para Progressive Enhancement (evita flash de sidebar vazia).
  -->
  <div class="left-sidebar-nav">
    <button
      id="sidebar-btn-hub"
      class="left-sidebar-item left-sidebar-item-primary"
      aria-label="Learning Hub — Painel Principal"
      title="Learning Hub — Painel Principal"
    >
      <i class="fa-solid fa-house left-sidebar-item-icon" aria-hidden="true"></i>
      <span class="left-sidebar-item-label">Home</span>
    </button>
  </div>
  <!--
    .left-sidebar-footer é gerado dinamicamente por buildSidebar(user).
    Contém: divisor, Perfil, Config, divisor, botão Recolher.
  -->
</nav>

    <main class="validation-container main-content-container">
      <section class="validator-section card">
        <h2>Validação de Questões</h2>
        <p id="validator-status" class="status-text">Aguardando autenticação...</p>
      </section>
      <div id="screen-message" class="screen-message hidden" role="status" aria-live="polite"></div>
      <section class="dashboard-section">
        <div class="stat-card pending"><h3>Pendentes</h3><p id="stat-pending" class="stat-number">0</p></div>
        <div class="stat-card approved"><h3>Aprovadas</h3><p id="stat-approved" class="stat-number">0</p><small>Hoje</small></div>
        <div class="stat-card rejected"><h3>Reprovadas</h3><p id="stat-rejected" class="stat-number">0</p><small>Hoje</small></div>
      </section>
      <section class="questions-section">
        <h2>Questões aguardando validação</h2>
        <div id="questions-list" class="questions-list"><p class="loading-msg">Carregando questões...</p></div>
      </section>
    </main>
    <div id="modal-reject" class="modal hidden">
      <div class="modal-content">
        <h3>Reprovar Questão</h3>
        <p>Informe o motivo da rejeição.</p>
        <textarea id="rejection-reason" rows="4" placeholder="Mínimo de 10 caracteres"></textarea>
        <div class="modal-actions">
          <button id="btn-cancel-reject" class="btn-secondary">Cancelar</button>
          <button id="btn-confirm-reject" class="btn-danger">Confirmar Reprovação</button>
        </div>
      </div>
    </div>
    <script src="js/validationStorage.js?v=msv2w3tq"></script>
    <script src="js/validationAPI.js?v=msv2w3tq"></script>
    <script type="module" src="js/validationUI.js?v=msv2w3tq"></script>
  </body>
</html>
