<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simulados AWS — Pratique com questões no estilo oficial dos exames AWS."
    />
    <title>Sprint de Estudos — Cloud Academy A3</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/style.css?v=bc0a49f5" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#001863" />
  
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>

  <body
    class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar"
  >
<header class="a3-header">
  <div class="flex items-center gap-2 md:gap-3">
    <button
      id="cloud-sidebar-toggle"
      class="btn-sidebar-toggle flex items-center justify-center group/cloud"
      title="Esconder menu lateral"
      aria-label="Alternar menu lateral"
      aria-expanded="true"
    >
      <i
        id="cloud-logo-icon"
        class="fa-solid fa-cloud text-2xl md:text-3xl group-hover/cloud:scale-110 transition-transform"
        aria-hidden="true"
      ></i>
    </button>
    <a href="index.html" class="a3-header-link" title="Voltar ao início">
      <div>
        <h1 class="text-base md:text-xl font-bold leading-tight">
          Cloud Academy A3
        </h1>
        <p class="text-[10px] md:text-xs text-gray-300">
          Sua jornada para certificações AWS
        </p>
      </div>
    </a>
  </div>
  <div class="a3-header-actions">
    <button
      id="btn-language"
      class="a3-btn a3-btn-secondary flex items-center gap-1 md:gap-2"
      aria-label="Alternar idioma"
      title="Alternar idioma"
    >
      <span class="text-[10px] md:text-xs font-bold"
        >🇧🇷 <span class="hidden sm:inline">PT-BR</span></span
      >
    </button>
    <button
      id="theme-toggle"
      class="a3-btn a3-btn-secondary"
      aria-label="Alternar modo escuro"
    >
      <i
        id="theme-icon"
        class="fa-solid fa-moon text-base md:text-xl"
        aria-hidden="true"
      ></i>
    </button>
    <button
      id="install-app"
      class="a3-btn a3-btn-secondary hidden md:flex items-center gap-2"
    >
      <i class="fa-solid fa-download"></i> Baixar App
    </button>
    <!-- User Menu — populado pelo shell.js -->
    <div id="user-menu-container"></div>
  </div>
</header>
<script src="./js/pwa/registerServiceWorker.js?v=bc0a49f5"></script>
<nav id="left-sidebar" aria-label="Menu principal" role="navigation">
  <!--
    .left-sidebar-nav é esvaziado e repovoado por buildSidebar(user)
    no momento do boot. O botão abaixo é apenas um fallback visual
    para Progressive Enhancement (evita flash de sidebar vazia).
  -->
  <div class="left-sidebar-nav">
    <button
      id="sidebar-btn-hub"
      class="left-sidebar-item left-sidebar-item-primary"
      aria-label="Learning Hub — Painel Principal"
      title="Learning Hub — Painel Principal"
    >
      <i
        class="fa-solid fa-house left-sidebar-item-icon"
        aria-hidden="true"
      ></i>
      <span class="left-sidebar-item-label">Home</span>
    </button>
  </div>
  <!--
    .left-sidebar-footer é gerado dinamicamente por buildSidebar(user).
    Contém: divisor, Perfil, Config, divisor, botão Recolher.
  -->
</nav>

<!-- O build resolve este partial aninhado depois de injetar a sidebar. -->
<div
  id="pomodoro-widget"
  class="hidden fixed top-20 right-6 z-50 bg-white p-5 rounded-2xl shadow-2xl border border-gray-200 dark:border-slate-700 w-64 animate-fade-in"
  role="dialog"
  aria-modal="false"
  aria-hidden="true"
  aria-labelledby="pomodoro-widget-title"
>
  <div class="flex justify-between items-center mb-4">
    <h4
      id="pomodoro-widget-title"
      class="font-bold text-gray-800 text-sm flex items-center gap-2"
    >
      <i class="fa-solid fa-stopwatch text-aws-orange"></i>
      <span data-i18n="pomodoro_focus_session">Sessão de Foco</span>
    </h4>
    <button
      type="button"
      onclick="closePomodoroWidget()"
      class="a3-btn a3-btn-danger"
      aria-label="Fechar widget Pomodoro"
      title="Fechar widget Pomodoro"
      data-i18n-aria-label="pomodoro_close"
      data-i18n-title="pomodoro_close"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <div
    id="pomodoro-display"
    class="text-5xl font-mono font-black text-center text-gray-800 dark:text-white my-4"
    aria-live="polite"
    aria-label="Tempo restante do Pomodoro"
    data-i18n-aria-label="pomodoro_time_remaining"
  >
    15:00
  </div>

  <div class="flex justify-center gap-2 mb-4">
    <button
      onclick="setPomodoroDuration(15)"
      data-pomodoro-duration="15"
      aria-pressed="false"
      class="pomodoro-duration-btn a3-btn a3-btn-secondary"
    >
      15 min
    </button>
    <button
      onclick="setPomodoroDuration(30)"
      data-pomodoro-duration="30"
      aria-pressed="false"
      class="pomodoro-duration-btn a3-btn a3-btn-secondary"
    >
      30 min
    </button>
    <button
      onclick="setPomodoroDuration(60)"
      data-pomodoro-duration="60"
      aria-pressed="false"
      class="pomodoro-duration-btn a3-btn a3-btn-secondary"
    >
      60 min
    </button>
  </div>

  <div class="flex justify-center gap-4">
    <button
      id="btn-pomodoro-toggle"
      onclick="togglePomodoro()"
      class="a3-btn a3-btn-primary a3-btn-lg w-14 flex items-center justify-center shadow-md"
      aria-label="Iniciar Pomodoro"
      aria-pressed="false"
      data-i18n-aria-label="pomodoro_start"
      type="button"
    >
      <i class="fa-solid fa-play text-xl" aria-hidden="true"></i>
    </button>
    <button
      onclick="resetPomodoro()"
      class="a3-btn a3-btn-secondary w-14 flex items-center justify-center"
      aria-label="Reiniciar Pomodoro"
      title="Reiniciar Pomodoro"
      data-i18n-aria-label="pomodoro_reset"
      data-i18n-title="pomodoro_reset"
      type="button"
    >
      <i class="fa-solid fa-rotate-right font-bold" aria-hidden="true"></i>
    </button>
  </div>
</div>



    <main
      id="main-section"
      class="flex flex-row gap-6 flex-1 a3-container py-6 main-content-container"
    >
      <!-- CONTENT AREA -->
      <section
        class="flex-1 min-w-0 flex flex-col gap-6 overflow-y-auto p-4"
        id="study-sprint-content"
      >
        <div id="sprint-module" class="a3-card w-full">
          <div class="a3-card-header">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-calendar-check text-aws-orange"></i>
              <h3 id="sprint-module-title" class="m-0">Sprint de Estudos</h3>
            </div>
            <span
              id="sprint-current-cert-badge"
              class="bg-aws-dark text-white text-[10px] font-bold px-2 py-1 rounded"
              >AWS</span
            >
          </div>
          <div class="a3-card-body">
            <p id="sprint-module-subtitle" class="hidden"></p>
            <div class="flex justify-between text-xs mb-3">
              <span
                id="sprint-progress-label"
                class="font-semibold text-muted dark:text-gray-400"
                >Progresso</span
              >
              <span id="sprint-progress-text" class="font-bold text-aws-orange"
                >0%</span
              >
            </div>
            <div id="sprint-days-grid" class="w-full"></div>
            <div
              id="sprint-recommendation-actions"
              class="flex flex-wrap gap-2 mt-4"
              aria-live="polite"
            ></div>
            <div
              class="mt-4 pt-4 border-t border-gray-100 dark:border-slate-700 text-center"
            >
              <p
                id="sprint-current-day-label"
                class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-2"
              >
                Dia 1
              </p>
              <button
                id="sprint-start-btn"
                class="a3-btn a3-btn-primary a3-btn-lg w-full"
              >
                Iniciar Sprint
              </button>
            </div>
          </div>
        </div>
      </section>
      <!-- /CONTENT AREA -->

      <!-- /SIDE INFO -->
    </main>

    <!-- Sprint Reader Overlay -->
    <div
      id="sprint-reader-overlay"
      class="hidden fixed inset-0 z-[9999] bg-black/95 overflow-y-auto"
    >
      <div class="container mx-auto px-4 py-8">
        <button
          id="close-sprint-reader"
          class="fixed top-4 right-4 a3-btn a3-btn-secondary z-[10000]"
        >
          <i class="fa-solid fa-xmark mr-2"></i> Fechar
        </button>
        <div
          id="sprint-reader-content"
          class="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-lg p-8 mt-16"
        >
          <!-- Conteúdo do dia será carregado aqui dinamicamente -->
        </div>
      </div>
    </div>
<footer
  class="w-full relative z-20 shrink-0 text-center py-6 text-sm text-muted dark:text-gray-400 mt-auto border-t border-gray-200 dark:border-slate-800 bg-white transition-colors"
>
  Plataforma colaborativa de estudo para certificações AWS construída para a
  comunidade da Guilda Z-Maguinhos | A3Data.
</footer>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      window.chartJsLoaded = new Promise((resolve) => {
        if (typeof Chart !== "undefined") {
          resolve();
        } else {
          const checkChart = setInterval(() => {
            if (typeof Chart !== "undefined") {
              clearInterval(checkChart);
              resolve();
            }
          }, 50);
        }
      });
    </script>
    <script src="./js/sprintData.js?v=bc0a49f5" type="module"></script>
    <script src="./js/pomodoroManager.js?v=bc0a49f5" type="module"></script>
    <script src="./js/app.js?v=bc0a49f5" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script type="module">
      import { initShell } from "./js/shell.js";
      import { authGuard } from "./js/core/authGuard.js";
      document.addEventListener("DOMContentLoaded", () => {
        const session = authGuard();
        if (!session) return;
        const user = session.user;
        initShell(user);
      });
    </script>

    <script type="module" src="js/gamificacao/sprintManager.js?v=bc0a49f5"></script>
  </body>
</html>
