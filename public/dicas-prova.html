<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dicas de Prova AWS — revisão rápida por contexto."
    />
    <title data-i18n="exam_tips_title">Dicas de Prova</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css?v=mt1ppaff" />
    <link rel="manifest" href="./manifest.json" />
  
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
  <body
    class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar exam-tips-page"
  >
<header class="a3-header">
      <div class="flex items-center gap-2 md:gap-3">
        <button
          id="cloud-sidebar-toggle"
          class="btn-sidebar-toggle flex items-center justify-center group/cloud"
          title="Esconder menu lateral"
          aria-label="Alternar menu lateral"
          aria-expanded="true"
        >
          <i
            id="cloud-logo-icon"
            class="fa-solid fa-cloud text-2xl md:text-3xl group-hover/cloud:scale-110 transition-transform"
            aria-hidden="true"
          ></i>
        </button>
        <a href="index.html" class="a3-header-link" title="Voltar ao início">
          <div>
            <h1 class="text-base md:text-xl font-bold leading-tight">
              Cloud Academy A3
            </h1>
            <p class="text-[10px] md:text-xs text-gray-300">
              Sua jornada para certificações AWS
            </p>
          </div>
        </a>
      </div>
      <div class="a3-header-actions">
        <button
          id="btn-language"
          class="a3-btn a3-btn-secondary flex items-center gap-1 md:gap-2"
          aria-label="Alternar idioma"
          title="Alternar idioma"
        >
          <span class="text-[10px] md:text-xs font-bold"
            >🇧🇷 <span class="hidden sm:inline">PT-BR</span></span
          >
        </button>
        <button
          id="theme-toggle"
          class="a3-btn a3-btn-secondary"
          aria-label="Alternar modo escuro"
        >
          <i
            id="theme-icon"
            class="fa-solid fa-moon text-base md:text-xl"
            aria-hidden="true"
          ></i>
        </button>
        <button
          id="install-app"
          class="a3-btn a3-btn-secondary hidden md:flex items-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Baixar App
        </button>
        <!-- User Menu — populado pelo shell.js -->
        <div id="user-menu-container"></div>
      </div>
    </header>
<nav id="left-sidebar" aria-label="Menu principal" role="navigation">
  <!--
    .left-sidebar-nav é esvaziado e repovoado por buildSidebar(user)
    no momento do boot. O botão abaixo é apenas um fallback visual
    para Progressive Enhancement (evita flash de sidebar vazia).
  -->
  <div class="left-sidebar-nav">
    <button
      id="sidebar-btn-hub"
      class="left-sidebar-item left-sidebar-item-primary"
      aria-label="Learning Hub — Painel Principal"
      title="Learning Hub — Painel Principal"
    >
      <i class="fa-solid fa-house left-sidebar-item-icon" aria-hidden="true"></i>
      <span class="left-sidebar-item-label">Home</span>
    </button>
  </div>
  <!--
    .left-sidebar-footer é gerado dinamicamente por buildSidebar(user).
    Contém: divisor, Perfil, Config, divisor, botão Recolher.
  -->
</nav>

    <main class="a3-container main-content-container">
      <section class="exam-tips-hero">
        <div>
          <p class="exam-tips-kicker">
            <i class="fa-solid fa-bullseye" aria-hidden="true"></i>
            <span data-i18n="exam_tips_kicker">Revisão rápida</span>
          </p>
          <h1 data-i18n="exam_tips_title">Dicas de Prova</h1>
          <p data-i18n="exam_tips_subtitle">
            Reconheça pistas, diferencie serviços e revise conceitos importantes
            para o exame.
          </p>
        </div>
        <span
          id="exam-tips-count"
          class="exam-tips-count"
          aria-live="polite"
        ></span>
      </section>
      <section class="exam-tips-toolbar a3-card" aria-label="Filtros de dicas">
        <label class="exam-tips-search">
          <span class="sr-only" data-i18n="exam_tips_search_label"
            >Buscar serviço, conceito ou palavra-chave</span
          >
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            id="exam-tips-search"
            type="search"
            data-i18n="exam_tips_search_placeholder"
            data-i18n-attr="placeholder"
            placeholder="Buscar serviço, conceito ou palavra-chave..."
          />
        </label>
        <label
          ><span data-i18n="exam_tips_certification">Certificação</span
          ><select
            id="exam-tips-certification"
            aria-label="Certificação"
          ></select
        ></label>
        <label
          ><span data-i18n="domain_filter">Domínio</span
          ><select id="exam-tips-domain" aria-label="Domínio"></select
        ></label>
        <button
          id="exam-tips-clear"
          class="a3-btn a3-btn-secondary"
          type="button"
          data-i18n="exam_tips_clear"
        >
          Limpar filtros
        </button>
      </section>
      <div
        id="exam-tips-types"
        class="exam-tips-type-filters"
        role="group"
        aria-label="Tipos de dica"
      ></div>
      <section
        id="exam-tips-feedback"
        class="exam-tips-feedback hidden"
        role="status"
      ></section>
      <section
        id="exam-tips-grid"
        class="exam-tips-grid"
        aria-live="polite"
      ></section>
    </main>
<footer
      class="w-full relative z-20 shrink-0 text-center py-6 text-sm text-muted dark:text-gray-400 mt-auto border-t border-gray-200 dark:border-slate-800 bg-white transition-colors"
    >
      Plataforma colaborativa de estudo para certificações AWS construída para a
      comunidade da Guilda Z-Maguinhos | A3Data.
    </footer>

    <script type="module">
      import { initShell } from "./js/shell.js";
      import { authGuard } from "./js/core/authGuard.js";
      import "./js/examTipsPage.js";
      document.addEventListener("DOMContentLoaded", () => {
        const session = authGuard();
        if (session) initShell(session.user);
      });
    </script>
  </body>
</html>
