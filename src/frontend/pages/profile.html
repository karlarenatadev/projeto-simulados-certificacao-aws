<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perfil do usuário — histórico, certificações e conquistas." />
    <title>Meu Perfil — Cloud Academy A3</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "aws-dark": "#001863",
              "aws-orange": "#0033FF",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#001863" />
  </head>

  <body class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar">

    <!-- {{HEADER_PAGE}} -->

    <!-- {{SIDEBAR}} -->

<!-- ===== FIM DA SIDEBAR ESQUERDA ===== -->

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="main-content-container profile-main" id="profile-page">
      <!-- Cabeçalho do perfil -->
      <div class="a3-card profile-header-card" id="profile-header">
        <div class="profile-avatar-wrap">
          <div class="a3-avatar profile-avatar-xl" id="profile-avatar-initials">
            ?
          </div>
        </div>
        <div class="profile-info">
          <h2 class="profile-name" id="profile-display-name">Carregando…</h2>
          <p class="profile-email" id="profile-email"></p>
          <span class="a3-badge a3-role-student" id="profile-role-badge"
            >Estudante</span
          >
        </div>
      </div>

      <!-- Grade de estatísticas -->
      <section class="profile-section" aria-labelledby="profile-stats-title">
        <h3 class="profile-section-title" id="profile-stats-title">
          <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>
          Estatísticas
        </h3>
        <div class="profile-stats-grid">
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-circle-play profile-stat-icon profile-stat-icon-quiz"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-total-quizzes">0</p>
            <p class="profile-stat-label">Simulados</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-trophy profile-stat-icon profile-stat-icon-best"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-best-score">—</p>
            <p class="profile-stat-label">Melhor nota</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-fire profile-stat-icon profile-stat-icon-streak"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-streak">0</p>
            <p class="profile-stat-label">Sequência</p>
          </div>
          <div class="a3-card profile-stat-card">
            <i
              class="fa-solid fa-star profile-stat-icon profile-stat-icon-xp"
              aria-hidden="true"
            ></i>
            <p class="profile-stat-value" id="stat-xp">0</p>
            <p class="profile-stat-label">XP total</p>
          </div>
        </div>
      </section>

      <!-- Certificações iniciadas -->
      <section class="profile-section" aria-labelledby="profile-certs-title">
        <h3 class="profile-section-title" id="profile-certs-title">
          <i class="fa-solid fa-certificate" aria-hidden="true"></i>
          Certificações em andamento
        </h3>
        <div class="profile-certs-list" id="profile-certs-list">
          <!-- Populado por JS -->
        </div>
      </section>

      <!-- Conquistas / badges -->
      <section class="profile-section" aria-labelledby="profile-badges-title">
        <h3 class="profile-section-title" id="profile-badges-title">
          <i class="fa-solid fa-award" aria-hidden="true"></i>
          Conquistas
        </h3>
        <div class="profile-badges-grid" id="profile-badges-grid">
          <!-- Populado por JS -->
        </div>
      </section>
    </main>

    <!-- App Shell: tema, idioma, UserMenu e Sidebar -->

    <!-- {{FOOTER}} -->

    <script type="module">
      import { storageManager } from "./js/storageManager.js";
      import { userManager } from "./js/userManager.js";
    </script>
    <script type="module">
      import { initShell } from "./js/shell.js";
      import { AuthService } from "./js/services/authService.js";
      document.addEventListener("DOMContentLoaded", async () => {
        const user = await AuthService.restoreSession();
        if (!user) {
          window.location.replace("./index.html");
          return;
        }
        initShell(user);
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeBtn = document.getElementById("theme-toggle");
        const langBtn = document.getElementById("btn-language");
        if (themeBtn)
          themeBtn.addEventListener(
            "click",
            () => window.toggleDarkModeShell && window.toggleDarkModeShell(),
          );
        if (langBtn)
          langBtn.addEventListener("click", () => {
            const lang = localStorage.getItem("aws_sim_lang") || "pt";
            const next = lang === "pt" ? "en" : "pt";
            localStorage.setItem("aws_sim_lang", next);
            if (window.syncLanguageButtonShell) window.syncLanguageButtonShell();
            window.location.reload();
          });
      });
    </script>

  </body>
</html>
