<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trilha de aprendizado AWS — acompanhe sua jornada, conquistas e progresso." />
    <title>Minha Jornada — Cloud Academy A3</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "aws-dark": "#001863",
              "aws-orange": "#0033FF",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#001863" />
  </head>

  <body class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar">

    <!-- {{HEADER_PAGE}} -->

    <!-- {{SIDEBAR}} -->

    <main class="flex-1 a3-container py-6 main-content-container">
        <div
          id="screen-jornada"
          class="p-8 md:p-12 flex flex-col items-center h-full overflow-y-auto custom-scroll fade-in"
        >
          <div class="w-full max-w-2xl text-center mb-10">
            <h2 class="text-3xl font-bold text-strong mb-2">
              <i class="fa-solid fa-map-location-dot text-aws-orange mr-2"></i>
              Jornada AWS
            </h2>
            <p class="text-muted dark:text-gray-400">
              Complete os módulos para desbloquear novas certificações e ganhar
              insígnias.
            </p>
          </div>

          <div
            class="trail-container w-full mb-16"
            id="trail-render-area"
          ></div>

          <div class="w-full max-w-4xl mb-12">
            <h3
              class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2"
            >
              <i class="fa-solid fa-medal text-yellow-500"></i> Suas Conquistas
            </h3>
            <div
              id="gamificacao-badges-grid"
              class="grid grid-cols-2 md:grid-cols-4 gap-4"
            ></div>
          </div>

        </div>

    </main>

    <!-- {{FOOTER}} -->

    <script src="./js/sprintData.js" type="module"></script>
    <script src="./js/app.js" type="module"></script>
    <script type="module">
      import { initShell } from "./js/shell.js";
      import { authGuard } from "./js/core/authGuard.js";
      document.addEventListener("DOMContentLoaded", () => {
        const session = authGuard();
        if (!session) return;
        const user = session.user;
        initShell(user);
        // Inicializa a trilha/jornada após o app.js ter registrado as funções window.*
        // Usa um pequeno delay para garantir que o app.js finalizou o DOMContentLoaded
        setTimeout(() => {
          if (typeof window.startJornada === "function") {
            window.startJornada();
          }
        }, 0);
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const themeBtn = document.getElementById("theme-toggle");
        const langBtn = document.getElementById("btn-language");
        if (themeBtn)
          themeBtn.addEventListener(
            "click",
            () => window.toggleDarkModeShell && window.toggleDarkModeShell(),
          );
        if (langBtn)
          langBtn.addEventListener("click", () => {
            const lang = localStorage.getItem("aws_sim_lang") || "pt";
            const next = lang === "pt" ? "en" : "pt";
            localStorage.setItem("aws_sim_lang", next);
            if (window.syncLanguageButtonShell) window.syncLanguageButtonShell();
            window.location.reload();
          });
      });
    </script>

  </body>
</html>
