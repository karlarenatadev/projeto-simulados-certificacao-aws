<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Flashcards AWS — Revisão espaçada de termos e conceitos essenciais." />
    <title>Flashcards — Cloud Academy A3</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "aws-dark": "#001863",
              "aws-orange": "#0033FF",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#001863" />
  </head>

  <body class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300 has-left-sidebar">

    <!-- {{HEADER_PAGE}} -->

    <!-- {{SIDEBAR}} -->

    <main class="flex-1 a3-container py-6 main-content-container">
        <div
          id="screen-flashcards"
          class="flex flex-col items-center justify-center text-center min-h-[80vh]"
        >
          <div class="flex flex-col items-center mb-6 fade-in">
            <span
              id="flashcards-cert-badge"
              class="bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400 border border-orange-300 dark:border-orange-700 text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-widest mb-4 shadow-sm"
            >
              CLF-C02
            </span>

            <h2 class="text-3xl font-bold mb-2 text-strong">
              <i class="fa-solid fa-layer-group text-a3-primary mr-2"></i> Modo
              Flashcards
            </h2>
            <p class="text-muted dark:text-gray-400 text-center">
              Revise termos essenciais da AWS de forma rápida e eficiente
            </p>
          </div>

          <div
            class="a3-card w-full max-w-2xl mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between shadow-sm"
          >
            <div class="flex-1 w-full text-left">
              <label
                for="flashcard-category"
                class="block text-xs font-bold text-muted dark:text-gray-400 uppercase tracking-wider mb-1"
              >
                <i class="fa-solid fa-filter mr-1"></i> Focar em:
              </label>
              <select
                id="flashcard-category"
                class="w-full bg-gray-50 border border-gray-300 dark:border-slate-600 text-gray-800 rounded-lg p-2.5 outline-none focus:border-orange-500 transition-colors cursor-pointer"
              >
                <option value="all">Todos os Domínios (Misturado)</option>
                <option value="review-deck" class="font-bold text-orange-600">
                  🚩 Meu Deck de Revisão
                </option>
              </select>
            </div>

            <div
              class="text-sm font-bold text-muted whitespace-nowrap bg-gray-100 /50 py-2.5 px-4 rounded-lg border border-gray-200 dark:border-slate-600"
            >
              Cartão
              <span id="flashcard-counter" class="text-aws-orange ml-1 text-lg"
                >1 / 96</span
              >
            </div>
          </div>

          <div class="w-full max-w-2xl mb-8">
            <div
              id="flashcard-container"
              class="flashcard-container mx-auto"
              role="button"
              tabindex="0"
              aria-label="Cartão de estudo. Clique para virar e ver a definição"
            >
              <div class="flashcard shadow-lg rounded-2xl">
                <div
                  class="flashcard-front bg-white border-2 border-gray-100 dark:border-slate-700 rounded-2xl"
                >
                  <div
                    class="text-sm uppercase tracking-wider text-muted dark:text-gray-400 mb-4 font-bold"
                    id="flashcard-domain-badge"
                  >
                    Termo AWS
                  </div>
                  <h3
                    id="flashcard-term"
                    class="text-2xl md:text-3xl font-bold text-strong mb-4"
                  >
                    Região AWS
                  </h3>
                  <div
                    class="text-sm text-gray-400 dark:text-muted italic mt-8 animate-pulse"
                  >
                    <i class="fa-solid fa-hand-pointer mr-2"></i> Clique para
                    ver a definição
                  </div>
                </div>

                <div
                  class="flashcard-back bg-orange-50 border-2 border-orange-200 dark:border-slate-600 rounded-2xl"
                >
                  <div
                    class="text-sm uppercase tracking-wider text-orange-600 dark:text-orange-400 mb-4 font-bold"
                  >
                    Definição Oficial
                  </div>
                  <p
                    id="flashcard-definition"
                    class="text-lg text-gray-800 dark:text-gray-200 leading-relaxed font-medium"
                  >
                    Área geográfica que contém múltiplas Zonas de
                    Disponibilidade isoladas...
                  </p>
                  <div
                    class="text-sm text-gray-400 dark:text-muted italic mt-8"
                  >
                    <i class="fa-solid fa-rotate-left mr-2"></i> Clique para
                    voltar
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="flex gap-4 mb-8 w-full max-w-2xl justify-center">
            <button
              id="btn-prev-flashcard"
              class="a3-btn a3-btn-secondary flex-1 max-w-[200px] shadow-sm"
              aria-label="Cartão anterior"
            >
              <i class="fa-solid fa-arrow-left mr-2"></i> Anterior
            </button>

            <button
              id="btn-next-flashcard"
              class="a3-btn a3-btn-primary a3-btn-lg flex-1 max-w-[200px] shadow-md"
              aria-label="Próximo cartão"
            >
              Próximo <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>

          <button
            onclick="exportToAnki()"
            class="a3-btn a3-btn-secondary flex items-center gap-2"
          >
            <i class="fa-solid fa-file-export"></i> Exportar para Anki
          </button>
        </div>
    </main>

    <!-- {{FOOTER}} -->

    <script src="./js/pomodoroManager.js" type="module"></script>
    <script src="./js/app.js" type="module"></script>
    <script type="module">
      import { initShell } from "./js/shell.js";
      import { authGuard } from "./js/core/authGuard.js";
      document.addEventListener("DOMContentLoaded", () => {
        const session = authGuard();
        if (!session) return;
        const user = session.user;
        initShell(user);
        // Inicializa os flashcards após o app.js ter registrado as funções window.*
        setTimeout(() => {
          if (typeof window.startFlashcards === "function") {
            window.startFlashcards();
          }
        }, 0);
      });
    </script>
    

  </body>
</html>
