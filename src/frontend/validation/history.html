<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <title>Histórico de validações - Cloud Academy A3</title>
  </head>
  <body class="has-left-sidebar">
    <header class="a3-header">
      <div class="flex items-center gap-2 md:gap-3"><button id="cloud-sidebar-toggle" class="btn-sidebar-toggle" title="Esconder menu lateral" aria-label="Alternar menu lateral" aria-expanded="true"><i id="cloud-logo-icon" class="fa-solid fa-cloud text-2xl md:text-3xl" aria-hidden="true"></i></button><a href="../index.html" class="a3-header-link"><div><h1 class="text-base md:text-xl font-bold leading-tight">Cloud Academy A3</h1><p class="text-[10px] md:text-xs text-gray-300">Sua jornada para certificações AWS</p></div></a></div>
      <div class="a3-header-actions"><button id="btn-language" class="a3-btn a3-btn-secondary" aria-label="Alternar idioma"></button><button id="theme-toggle" class="a3-btn a3-btn-secondary" aria-label="Alternar modo escuro"><i id="theme-icon" class="fa-solid fa-moon" aria-hidden="true"></i></button><button id="install-app" class="a3-btn a3-btn-secondary hidden md:flex" aria-label="Baixar App"><i class="fa-solid fa-download" aria-hidden="true"></i></button><div id="user-menu-container"></div></div>
    </header>
    <nav id="left-sidebar" aria-label="Menu principal" role="navigation"><div class="left-sidebar-nav"></div></nav>
    <main class="validation-container main-content-container admin-page">
      <section class="validator-section card admin-page-header"><p id="validator-status" class="status-text">Carregando sessão...</p><h1>Histórico de validações</h1><p>Questões já aprovadas ou rejeitadas.</p></section>
      <div id="screen-message" class="hidden" role="status" aria-live="polite"></div>
      <div class="admin-page-content"><section class="questions-section card"><div class="admin-toolbar"><label for="history-status">Status</label><select id="history-status"><option value="">Todas</option><option value="APPROVED">Aprovadas</option><option value="REJECTED">Rejeitadas</option></select></div><div id="history-list"><p class="admin-empty">Carregando histórico...</p></div></section></div>
    </main>
    <script src="js/validationAPI.js"></script>
    <script type="module">import { initHistoryPage } from './js/historyPage.js'; document.addEventListener('DOMContentLoaded', initHistoryPage);</script>
  </body>
</html>
