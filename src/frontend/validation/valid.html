<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Questões - Cloud Academy A3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="has-left-sidebar">
    <!-- {{HEADER_PAGE}} -->
    <!-- {{SIDEBAR}} -->
    <main class="validation-container main-content-container">
      <section class="validator-section card">
        <h2>Validação de Questões</h2>
        <p id="validator-status" class="status-text">Aguardando autenticação...</p>
      </section>
      <div id="screen-message" class="screen-message hidden" role="status" aria-live="polite"></div>
      <section class="dashboard-section">
        <div class="stat-card pending"><h3>Pendentes</h3><p id="stat-pending" class="stat-number">0</p></div>
        <div class="stat-card approved"><h3>Aprovadas</h3><p id="stat-approved" class="stat-number">0</p><small>Hoje</small></div>
        <div class="stat-card rejected"><h3>Reprovadas</h3><p id="stat-rejected" class="stat-number">0</p><small>Hoje</small></div>
      </section>
      <section class="questions-section">
        <h2>Questões aguardando validação</h2>
        <div id="questions-list" class="questions-list"><p class="loading-msg">Carregando questões...</p></div>
      </section>
    </main>
    <div id="modal-reject" class="modal hidden">
      <div class="modal-content">
        <h3>Reprovar Questão</h3>
        <p>Informe o motivo da rejeição.</p>
        <textarea id="rejection-reason" rows="4" placeholder="Mínimo de 10 caracteres"></textarea>
        <div class="modal-actions">
          <button id="btn-cancel-reject" class="btn-secondary">Cancelar</button>
          <button id="btn-confirm-reject" class="btn-danger">Confirmar Reprovação</button>
        </div>
      </div>
    </div>
    <script src="js/validationStorage.js"></script>
    <script src="js/validationAPI.js"></script>
    <script type="module" src="js/validationUI.js"></script>
  </body>
</html>
