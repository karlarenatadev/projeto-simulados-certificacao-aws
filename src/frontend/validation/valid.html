<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Questões - Cloud Academy A3</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/valid.css" />
  </head>
  <body class="has-left-sidebar">
    <header class="a3-header">
      <a href="../index.html" class="a3-header-link">Cloud Academy A3</a>
      <div class="a3-header-actions">
        <button id="theme-toggle" class="a3-btn a3-btn-secondary" aria-label="Alternar modo escuro">Tema</button>
        <div id="user-menu-container"></div>
      </div>
    </header>
    <nav id="left-sidebar" aria-label="Menu principal" role="navigation">
      <div class="left-sidebar-nav"></div>
    </nav>
    <main class="validation-container main-content-container">
      <section class="validator-section card">
        <h2>Identificação do Validador</h2>
        <p id="validator-status" class="status-text">Status: Aguardando autenticação...</p>
        <div id="login-section">
          <p class="mock-notice">Acesso restrito a usuários com role VALIDATOR ou ADMIN.</p>
          <div class="input-group">
            <input type="email" id="login-email" placeholder="seu.nome@a3data.com.br" autocomplete="email" />
            <button id="btn-login" class="btn-primary">Entrar</button>
          </div>
          <p id="login-error" class="status-text hidden" style="color:#ef4444"></p>
        </div>
      </section>
      <div id="screen-message" class="screen-message hidden" role="status" aria-live="polite"></div>
      <section class="dashboard-section">
        <div class="stat-card pending"><h3>Pendentes</h3><p id="stat-pending" class="stat-number">0</p></div>
        <div class="stat-card approved"><h3>Aprovadas</h3><p id="stat-approved" class="stat-number">0</p><small>Hoje</small></div>
        <div class="stat-card rejected"><h3>Reprovadas</h3><p id="stat-rejected" class="stat-number">0</p><small>Hoje</small></div>
      </section>
      <section class="questions-section">
        <h2>Questões aguardando validação</h2>
        <div id="questions-list" class="questions-list"><p class="loading-msg">Carregando questões...</p></div>
      </section>
    </main>
    <div id="modal-reject" class="modal hidden">
      <div class="modal-content">
        <h3>Reprovar Questão</h3>
        <p>Informe o motivo da rejeição.</p>
        <textarea id="rejection-reason" rows="4" placeholder="Mínimo de 10 caracteres"></textarea>
        <div class="modal-actions">
          <button id="btn-cancel-reject" class="btn-secondary">Cancelar</button>
          <button id="btn-confirm-reject" class="btn-danger">Confirmar Reprovação</button>
        </div>
      </div>
    </div>
    <script src="js/validationStorage.js"></script>
    <script src="js/validationAPI.js"></script>
    <script src="js/validationUI.js"></script>
    <script type="module">
      import { AuthService } from '../../js/services/authService.js';
      import { initShell } from '../../js/shell.js';
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await AuthService.restoreSession();
        if (user) initShell(user);
      });
    </script>
  </body>
</html>
