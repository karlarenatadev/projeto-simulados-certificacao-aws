<!-- ===== LOGIN OVERLAY ===== -->
    <!-- Exibido quando não há sessão válida. Ocultado por app.js após autenticação. -->
    <div
      id="login-overlay"
      class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/95 backdrop-blur-sm hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-title"
    >
      <div
        class="w-full max-w-md mx-4 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 flex flex-col gap-6"
      >
        <!-- Logo / Título -->
        <div class="text-center">
          <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600 mb-4"
          >
            <i
              class="fa-solid fa-cloud text-white text-2xl"
              aria-hidden="true"
            ></i>
          </div>
          <h2
            id="login-title"
            class="text-2xl font-black text-gray-900 dark:text-white"
          >
            Cloud Academy A3
          </h2>
          <p class="text-sm text-gray-500 dark:text-slate-400 mt-1">
            Acesso restrito a colaboradores A3Data
          </p>
        </div>

        <!-- Formulário -->
        <form id="login-form" novalidate>
          <label
            for="login-email-input"
            class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-1"
          >
            Email corporativo
          </label>
          <input
            id="login-email-input"
            type="email"
            autocomplete="email"
            placeholder="seu.nome@a3data.com.br"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            aria-describedby="login-error-msg"
          />

          <!-- Mensagem de erro -->
          <p
            id="login-error-msg"
            class="mt-2 text-sm text-red-600 dark:text-red-400 hidden"
            role="alert"
            aria-live="polite"
          ></p>

          <!-- Botão de acesso -->
          <button
            id="login-submit-btn"
            type="submit"
            class="mt-5 w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-3 rounded-lg transition-all shadow-md"
          >
            <span id="login-btn-text">Entrar</span>
            <i
              id="login-btn-spinner"
              class="fa-solid fa-spinner fa-spin hidden"
              aria-hidden="true"
            ></i>
          </button>
        </form>

        <!-- Rodapé -->
        <p class="text-center text-xs text-gray-400 dark:text-slate-500">
          Uso interno A3Data &mdash; acesso exclusivo com email
          <span class="font-semibold">@a3data.com.br</span>
        </p>
      </div>
    </div>
    <!-- ===== /LOGIN OVERLAY ===== -->
