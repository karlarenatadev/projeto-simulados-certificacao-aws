<header class="a3-header">
      <div class="flex items-center gap-2 md:gap-3">
        <button
          id="cloud-sidebar-toggle"
          class="btn-sidebar-toggle flex items-center justify-center group/cloud"
          title="Esconder menu lateral"
          aria-label="Alternar menu lateral"
          aria-expanded="true"
        >
          <i
            id="cloud-logo-icon"
            class="fa-solid fa-cloud text-2xl md:text-3xl group-hover/cloud:scale-110 transition-transform"
            aria-hidden="true"
          ></i>
        </button>
        <div
          id="home-trigger"
          class="a3-header-link cursor-pointer"
          title="Voltar ao início"
        >
          <div>
            <h1
              class="text-base md:text-xl font-bold leading-tight group-hover:text-primary transition-colors"
            >
              Cloud Academy A3
            </h1>
            <p class="text-[10px] md:text-xs text-gray-300">
              Sua jornada para certificações AWS
            </p>
          </div>
        </div>
      </div>
      <div class="a3-header-actions">
        <button
          id="btn-language"
          class="a3-btn a3-btn-secondary flex items-center gap-1 md:gap-2"
          aria-label="Alternar idioma"
          title="Alternar idioma"
        >
          <span class="text-[10px] md:text-xs font-bold"
            >🇧🇷 <span class="hidden sm:inline">PT-BR</span></span
          >
        </button>

        <button
          id="theme-toggle"
          class="a3-btn a3-btn-secondary"
          aria-label="Alternar modo escuro"
        >
          <i
            id="theme-icon"
            class="fa-solid fa-moon text-base md:text-xl"
            aria-hidden="true"
          ></i>
        </button>

        <button
          id="header-pomodoro-btn"
          onclick="togglePomodoroWidget()"
          class="a3-btn a3-btn-secondary flex items-center gap-2 group"
        >
          <i class="fa-solid fa-stopwatch group-hover:animate-pulse"></i>
          <span id="header-pomodoro-timer" class="font-mono">15:00</span>
        </button>

        <button
          id="install-app"
          class="a3-btn a3-btn-secondary hidden md:flex items-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Baixar App
        </button>

        <div
          id="score-container"
          class="hidden bg-gray-700 px-2 py-1 md:px-3 rounded-full flex items-center gap-1 md:gap-2"
        >
          <i
            class="fa-solid fa-bullseye text-green-400 text-xs md:text-base"
            aria-hidden="true"
          ></i>
          <span id="score-display" class="text-xs md:text-sm" aria-live="polite"
            >0 / 0</span
          >
        </div>

        <!-- User Menu — populado pelo shell.js após autenticação -->
        <div id="user-menu-container"></div>
      </div>
    </header>
