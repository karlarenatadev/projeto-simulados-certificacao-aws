<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador AWS - Certificações</title>
    <script>
      // GitHub Pages fallback for client-side navigation under the repository path.
      const repositoryPath = window.location.pathname.startsWith(
        "/projeto-simulados-certificacao-aws/",
      )
        ? "/projeto-simulados-certificacao-aws/"
        : "/";
      const path = window.location.pathname.replace(repositoryPath, "");
      if (path && !path.includes(".")) {
        window.location.href = `${repositoryPath}?${encodeURIComponent(path)}`;
      }
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
